
name: Solar Laravel AWS Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solar-private-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Laravel to EC2
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - name: Update Laravel Website
        shell: bash
        run: |
          set -euo pipefail

          cd /var/www/laravel

          test -f .env
          test -w /var/www/laravel

          export GIT_SSH_COMMAND="ssh -i /home/ubuntu/.ssh/laravel_github -o IdentitiesOnly=yes -o BatchMode=yes"

          git pull --ff-only origin main

          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

          npm ci
          npm run build

          php artisan config:clear
          php artisan config:cache

          curl --fail \
            --silent \
            --show-error \
            --output /dev/null \
            http://127.0.0.1/

          echo "AWS EC2 Automatic Deployment Successful"
