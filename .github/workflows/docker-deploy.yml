
name: Solar Laravel Docker CI CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: solar-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/prakash7991/solar-site-laravel:latest
            ghcr.io/prakash7991/solar-site-laravel:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Login to GHCR on EC2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | sudo -n docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Deploy Laravel to EC2
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          cd /opt/solar-laravel
          sudo -n env IMAGE_TAG="$IMAGE_TAG" docker compose -f compose.yaml -f compose.deploy.yaml pull app
          sudo -n env IMAGE_TAG="$IMAGE_TAG" docker compose -f compose.yaml -f compose.deploy.yaml up -d --no-deps --no-build app
          sleep 5
          curl --fail --silent --show-error http://localhost/ -o /dev/null
          sudo -n docker inspect solar-laravel-app --format '{{.Config.Image}}'
